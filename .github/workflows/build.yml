name: Build e release

# Ad ogni push e pull request: test e APK firmato (scaricabile dagli artefatti del run).
# Con un tag "vX.Y.Z" l'APK viene anche pubblicato in una release di GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Test Python (coin_ml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MachineLearning/requirements.txt
      - name: Dipendenze
        run: pip install numpy opencv-python-headless pillow imagehash pyyaml
      - name: Test
        working-directory: MachineLearning
        run: python -m unittest discover tests

  dotnet-tests:
    name: Test .NET (riconoscimento ed etichettatore)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test MachineLearning/CoinLabeler.Tests/CoinLabeler.Tests.csproj -c Release

  android:
    name: APK Android firmato
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload MAUI per Android
        run: dotnet workload install maui-android

      # Il keystore sta nei segreti del repository (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS):
      # con la stessa firma l'APK di una nuova versione si installa sopra quello vecchio.
      - name: Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release senza firma: imposta i segreti ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS (vedi README)."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Segreti di firma assenti: l'APK sara' firmato con la chiave di debug (si installa, ma non si aggiorna con le versioni firmate)."
          fi

      - name: Versione
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila l'APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PATH: ${{ steps.keystore.outputs.path }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          SIGN_ARGS=()
          if [ "$SIGNED" = "true" ]; then
            SIGN_ARGS=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$KS_PATH"
                       -p:AndroidSigningStorePass=env:KS_PASS -p:AndroidSigningKeyAlias="$KS_ALIAS"
                       -p:AndroidSigningKeyPass=env:KS_PASS)
          fi
          # Il numero di versione interno deve crescere a ogni build: si usa il numero del run
          dotnet publish MobileApp/LiveCoinCounter/LiveCoinCounter.csproj \
            -f net10.0-android -c Release -o out \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="${VERSION_NAME%%-*}" \
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=true \
            "${SIGN_ARGS[@]}"

      - name: Rinomina l'APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ls -la out
          APK=$(ls out/*-Signed.apk 2>/dev/null | head -n1)
          [ -n "$APK" ] || APK=$(ls out/*.apk | head -n1)
          # Le librerie ONNX Runtime per Linux non devono finire nell'APK (si carica solo quella Android): vedi il csproj
          if unzip -l "$APK" | grep -q "libonnxruntime_providers_shared.so"; then
            echo "::error::L'APK contiene librerie ONNX Runtime per Linux: sul telefono l'app andrebbe in errore."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/LiveCoinCounter-$VERSION_NAME.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LiveCoinCounter-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Release su GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, dotnet-tests, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiveCoinCounter-apk
          path: dist
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "LiveCoinCounter ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Installazione: scarica l'APK sul telefono Android (7.0 o successivo), aprilo e consenti l'installazione da questa origine. Dettagli nel README."
